server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Web Bluetooth + Geolocation nur für die eigene Origin; Kamera/Mikrofon nie.
  add_header Permissions-Policy "bluetooth=(self), geolocation=(self), camera=(), microphone=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # connect-src: MQTT-Broker (wss) wird vom Nutzer frei gewählt. img-src: OSM-Kacheln.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' wss: https:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }
  location /presets/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
