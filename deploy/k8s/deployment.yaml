# Statische PWA hinter nginx. Der Ingress (Host, Cloudflare-Tunnel) liegt bewusst im Cluster-Repo.
# Image-Digest nach dem ersten CI-Lauf eintragen (Cluster-Regel: Images gepinnt).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: carinthiamesh-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: carinthiamesh-app }
  template:
    metadata:
      labels: { app: carinthiamesh-app }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/achildrenmile/carinthiamesh-app:latest # TODO: durch @sha256:<digest> ersetzen
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
