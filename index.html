<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarinthiaMesh – Phase-0-Spike</title>
  <style>
    body { font: 15px system-ui, sans-serif; margin: 1rem; max-width: 60rem; }
    button { font: inherit; padding: .6rem 1rem; margin: .2rem .2rem .2rem 0; }
    pre { background: #111; color: #cfc; padding: .6rem; overflow: auto; max-height: 26rem; font-size: 12px; }
    #env { padding: .5rem; background: #eee; }
  </style>
</head>
<body>
  <h1>CarinthiaMesh – Phase-0-Spike</h1>
  <p id="env"></p>
  <div>
    <button id="connect">1 · Verbinden + Handshake</button>
    <button id="time" disabled>2 · Zeit setzen</button>
    <button id="lists" disabled>3 · Kontakte + Kanäle</button>
    <button id="telemetry" disabled>4 · Telemetrie (erster Repeater)</button>
    <button id="copy">Log kopieren</button>
  </div>
  <p>Letzter RX-Log-Push: <span id="rxlog">–</span> (Anzahl: <span id="rxcount">0</span>)</p>
  <pre id="log"></pre>
  <script type="module" src="/src/main.ts"></script>
